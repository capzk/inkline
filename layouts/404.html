{{ define "main" }}
<div class="notfound">
  <div class="nf-code">404</div>
  <h1 class="nf-title">{{ T "notFoundTitle" }}</h1>
  <p class="nf-desc">{{ T "notFoundDescription" }}</p>
  <div class="nf-actions">
    <a class="nf-btn" href="{{ "/" | relURL }}">{{ T "backHome" }}</a>
    <a class="nf-link" href="{{ "/posts/" | relURL }}">{{ T "browseAllPosts" }}</a>
  </div>
</div>
<style>
.notfound{max-width:560px;margin:80px auto 120px;text-align:center;padding:0 24px;}
.nf-code{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent-dark));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px;}
.nf-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
.nf-desc{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:28px;}
.nf-actions{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;}
.nf-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px 22px;border-radius:999px;transition:transform .2s;}
.nf-btn:hover{transform:translateY(-2px);}
.nf-link{font-size:14px;color:var(--accent);text-decoration:none;font-weight:600;border-bottom:1px solid var(--accent-soft);padding-bottom:2px;}
.nf-link:hover{border-color:var(--accent);}
@media(max-width:560px){.nf-code{font-size:72px;}.nf-title{font-size:24px;}}
</style>
{{ end }}
