{{ define "main" }}
<div class="section-h">
  <h2>{{ .Title }}</h2>
  <span>{{ T "postsCount" (len .Pages) }}</span>
</div>
<div class="grid">
  {{ $paginator := .Paginate .Pages }}
  {{ range $paginator.Pages }}{{ partial "post-card.html" . }}{{ end }}
</div>
{{ partial "pagination.html" . }}
{{ end }}
