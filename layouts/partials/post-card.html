{{ $cat := "科技" }}{{ with .Params.categories }}{{ $cat = index . 0 }}{{ end }}
<a class="pcard" href="{{ .RelPermalink }}">
  <span class="bar" aria-hidden="true" style="{{ printf "background:%s" (partial "cover-gradient.html" $cat) | safeCSS }}"></span>
  <div class="body">
    <div class="top"><span class="cat">{{ $cat }}</span><span class="date">{{ .Date.Format "01·02" }}</span></div>
    <h3>{{ .Title }}</h3>
    <p>{{ .Plain | truncate 54 "…" }}</p>
  </div>
</a>
