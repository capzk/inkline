# Inkline 主题界面文案 —— 简体中文
#
# 新增语言：复制本文件为 <语言代码>.toml（如 en.toml、zh-tw.toml）再翻译。
#
# 语言包按「语言键」选取，文件名必须是 i18n/<语言键>.toml：
#   - 单语言站点：语言键取自站点 config 的 locale
#     （本站 locale = 'zh-CN' → 命中 zh-cn.toml，实测大小写不敏感）
#   - 多语言站点：语言键取自 [languages.<键>]，即 i18n/<键>.toml
# 若站点 locale 找不到对应文件，文案会被渲染成空字符串（构建日志出现
# MISSING_TRANSLATION），页面会「丢字」而不是报错，务必记得建包。
#
# 两条语法提醒：
#   1. 占位符是 go-i18n v2 语法，用双花括号：{{ .Count }}、{{ .Name }}。
#      单花括号（如 {shown}）不会被渲染，是留给 JS 自己替换的，见 searchStatus* 三项。
#
# 计数类调用方式：{{ T "readingTime" .ReadingTime }} → 填充 {{ .Count }}
# 多参数调用方式：{{ T "copyrightText" (dict "Author" $a "Site" $s) }}

