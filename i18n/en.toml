# Inkline theme strings — English
#
# To add a language: copy zh-cn.toml (the reference file) under a new
# <language-key>.toml and translate the values.
#
# The file name must match the language key Hugo resolves to:
#   - single-language site: the key comes from the site's `locale` setting
#     (locale = 'en' or 'en-US' → en.toml; matching is case-insensitive)
#   - multi-language site: the key comes from [languages.<key>] → i18n/<key>.toml
# If no file matches, strings render as EMPTY (Hugo logs MISSING_TRANSLATION);
# the page silently loses its labels instead of erroring, so always ship a pack.
#
# One syntax note: placeholders use go-i18n v2 syntax with double braces
# ({{ .Count }}, {{ .Name }}). Single braces such as {shown} are left untouched
# on purpose — they are substituted by the search script (see searchStatus*).

